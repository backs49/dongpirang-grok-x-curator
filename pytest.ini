[pytest]
asyncio_mode = auto
filterwarnings =
    error
    # NiceGUI의 FilePersistentDict.backup()은 storage-*.json.tmp 쓰기를 백그라운드 태스크로 fire-and-forget한다.
    # 테스트의 이벤트루프가 그 태스크보다 먼저 닫히면 미완료 파일 핸들이 나중에 GC되며 unraisable 예외로
    # 샌다(GC 타이밍에 따른 플레이키, pytest-asyncio 1.x의 루프 정리 시점 변화로 error 필터 아래서 처음 드러남).
    # 우리 코드가 아니라 NiceGUI 내부 자원 정리 문제이므로 이 구체적 파일 패턴에 한해 좁게 무시한다.
    ignore:Exception ignored while finalizing file <_io\.FileIO name='.*\.nicegui[/\\]storage-[a-z]+-[0-9a-f-]+\.json\.tmp' mode='wb':pytest.PytestUnraisableExceptionWarning:_pytest\.unraisableexception
